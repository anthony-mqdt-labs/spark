  # Only definable after S2 (generic-Backend dry run) + S4 (memory profile).
  requires_tests: false

depends_on: []
external:
  - repo: "leejet/stable-diffusion.cpp"
    what: >
      Supervised child is sd-server (examples/server/), not sd-cli. Ships
      OpenAI (/v1/images/*), A1111 (/sdapi/v1/*) and native (/sdcpp/v1/*)
      HTTP surfaces. Weights are NOT supplied -- they are operator-fetched
      GGUF/safetensors artefacts, three of them per pipeline (denoiser, VAE,
      text encoder). Upstream added day-0 Qwen-Image-2.1 support 2026-09-20.

