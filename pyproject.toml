[project]
name = "spark"
version = "0.1.0"
description = "Hardened multi-runtime LLM inference wrapper for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "spark operator" }]

# Lean, pinned, pure-Python, no native build, no postinstall hooks.
# Exact pins (not ranges): a dependency update is a new package and must be
# vetted and locked deliberately. spark is a *wrapper*: it orchestrates
# already-installed runtime CLIs via subprocess and never imports mlx/vllm/llama.
dependencies = [
    "click==8.4.2",
    "pydantic==2.13.4",
    "platformdirs==4.10.0",
    "rich==13.9.4",
]

[project.scripts]
spark = "spark.cli.app:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark"]

# Ship the TOML config tree inside the package so an installed `spark` can find
# its defaults regardless of CWD.
[tool.hatch.build.targets.wheel.force-include]
"config" = "spark/_bundled_config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true

# Lint/type gate: explicit, narrow rule set. E4/E7/E9/F/B catch real defects
# without arguing about formatting; `ruff format` owns layout at 100 columns.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pyright]
venvPath = "."
venv = ".venv"
