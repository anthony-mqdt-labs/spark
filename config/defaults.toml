# spark default configuration (shipped, read-only).
# Override per-host in $XDG_CONFIG_HOME/spark/config.toml (or ~/.config/spark/).
# This file is DATA, not code: no launch flag belongs anywhere but here / runtimes/.

[general]
host = "127.0.0.1"          # bind loopback only; no LAN exposure by default
# spark's own servers live in 8095-8099, and 8095 is the canonical endpoint that
# consumers (agent CLIs, banter's backend-spark) pin. Ports below 8095 belong to
# other things on this host (rsi-proto holds 8080), which is why the range does
# not start at 8080 any more: a preferred port that is taken causes drift, and
# drift used to be silent — see `run/instances/<model>.json` for the published
# endpoint, and the `port_drift` telemetry event when it happens.
port_range = [8095, 8099]
log_retention_days = 7
# Backend preference for this class of host (Apple Silicon). Highest first.
preference = ["mlx_lm", "mlx_vlm", "llama_cpp", "omlx", "ollama"]

# Host probe cache: a fresh detection is this expensive, so reuse it for a day
# unless --reprobe / doctor --no-cache is asked for.
[probe]
max_age_s = 86400.0

[memory]
# 16 GB unified memory is shared with the OS + GUI. 0.65 leaves real headroom.
usable_fraction = 0.65
enforce = true
overhead_multiplier = 1.20

[memory.bytes_per_param]
f16 = 2.0
bf16 = 2.0
q8 = 1.0
q6 = 0.75
q5 = 0.65
q4 = 0.5
q3 = 0.4
q2 = 0.3

[disk]
# This host runs hot on disk; refuse downloads that would cross this floor.
min_free_gib = 10.0
enforce = true

[supervisor]
max_restarts = 3
stable_after_s = 300.0  # a crash after this much healthy uptime gets a fresh budget
backoff_base_s = 1.0
backoff_max_s = 30.0
health_interval_s = 5.0
shutdown_grace_s = 10.0
# Confirm a real generation before declaring a server ready. Lazy runtimes
# (mlx_lm/mlx_vlm) listen before their model is resident and answer /v1/models
# from an HF-cache scan, so a health probe alone cannot distinguish "serving"
# from "merely breathing" — a dead generator thread would otherwise be reported
# ready forever, with every request hanging.
verify_generation = true
# Health probe socket timeout; distinct from the interval between probes.
health_probe_timeout_s = 3.0
# Published endpoint records are heartbeat-updated this often.
instance_heartbeat_s = 30.0
# Peak RSS is sampled every Nth monitor tick (ps is a fork+exec per sample).
rss_sample_ticks = 6
# Roll the per-server stdout/stderr log once it passes this size.
server_log_roll_mib = 64

# Research providers for `spark download`: an ordered fallback chain. Each is
# tried until one returns a schema-valid config. A provider is skipped if its
# detect_binary is not on PATH. Output is STAGED for review, never auto-applied.
# HARD RULE: prompts contain only the model card + host facts + runtime names —
# never secrets (enforced by the secrets-guard before dispatch).
[research]
enabled = true
model_card_chars = 6000
# --help probe for accept-time flag validation (a cold llama.cpp build can be slow).
flag_probe_timeout_s = 15.0

[[research.providers]]
name = "claude"
type = "cli"
detect_binary = "claude"
# No tools, no MCP: the prompt embeds a third-party model card, so a
# prompt-injected card must have nothing to act with. JSON out is all we need.
command = ["claude", "-p", "--tools", "", "--strict-mcp-config", "--output-format", "json"]
prompt_via = "stdin"
parse = "json_envelope"
envelope_field = "result"
timeout_s = 300.0

# hermes one-shot: `-z/--oneshot PROMPT` sends a single prompt and prints ONLY
# the model's response (no banner, no envelope). Prompt is an argv arg, not stdin.
# Verified live: clean JSON on stdout, exit 0. raw_json + tolerant extraction.
[[research.providers]]
name = "hermes"
type = "cli"
detect_binary = "hermes"
# Tools off: hermes has no "none" toolset, but `-t clarify` selects only the
# ask-the-user tool and oneshot (-z) strips that toolset, leaving zero tools —
# verified against hermes v0.23.1's own get_tool_definitions (19 tools -> 0).
command = ["hermes", "-t", "clarify", "-z", "{prompt}"]
prompt_via = "arg"
parse = "raw_json"
timeout_s = 300.0

# pi non-interactive: `-p/--print` processes the prompt and exits; the prompt is
# a positional message arg. Kept in text mode (not `--mode json`) so output is the
# model's direct response, parsed by the tolerant raw_json extractor — uniform with
# hermes and independent of pi's json-envelope schema. Requires pi to have a
# reachable inference backend configured (its `defaultProvider`); spark only owns
# the invocation flags, not pi's backend auth.
[[research.providers]]
name = "pi"
type = "cli"
detect_binary = "pi"
# --no-tools: same injection posture as claude (the card is untrusted text).
command = ["pi", "-p", "--no-tools", "{prompt}"]
prompt_via = "arg"
parse = "raw_json"
timeout_s = 300.0
