metadata:
  motivation: >
    Spark becomes the machine's model-fleet authority: one resident owner of
    "what is loaded", serving OpenAI-compatible endpoints and publishing them
    to consumers through their own config channels. First consumer: the
    darkcore router (tiers move from in-process mlx-lm to HTTP endpoints).
  notes: >
    WIP BY DESIGN (operator, 2026-07-18): research and spikes before any
    design.md. Six gates: S1 daemon skeleton, S2 cross-process residency
    economics (in-process Exp 4 numbers do not transfer), S3 HTTP tier
    latency + failure modes, S4 residency-negotiation contract (the hard
    core — paper spike), S5 roster-actuation dry run through set_config,
    S6 embedder as FIRST FLEET TENANT (promoted from open question 5 by
    operator — run right after S1; smallest end-to-end proof, cheapest
    falsification; exercises ensure/release through a T2 climb at 1/200th
    tier weight). Open questions 1-4 in prd.md block design.md.
    Dark-operability stays a router invariant: no-sparkd operation must
    keep working.
