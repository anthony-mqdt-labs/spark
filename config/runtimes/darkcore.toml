# dark-core — the patchwork dynamic router (T0/T1/T2 cascade) as a spark-
# supervised child (integration seam 5, 2026-07-17).
#
# Unlike the relay backend (attach-only: spark can watch it but not restart
# it), this runtime SPAWNS `python -m darkcore.server` under the supervisor:
# health-wait, bounded restart+backoff on crash, graceful SIGINT — the router
# becomes a first-class spark citizen while its code stays in patchwork.
#
# The interpreter is the router's OWN uv project venv (experiments/router
# is a standalone uv project: pinned deps in uv.lock, darkcore installed
# editable — importable from any cwd, no PYTHONPATH). Refresh after dep
# changes with `uv sync` in that directory. The router's paths (config,
# telemetry, exemplars) are __file__-derived, so cwd never matters.
#
# NB detection: the detect binary IS an interpreter (no console-script
# shebang), so [detect].python_requires would be inert here — the runtime's
# deps are guaranteed by the router project's uv.lock instead.
name = "darkcore"
description = "Patchwork dark-core dynamic router (verify-and-escalate cascade) as a supervised child."
model_format = "any"
requires_os = ["Darwin"]
requires_arch = ["arm64"]
install_hint = "cd ../patchwork/experiments/router && uv sync   (standalone uv project)"

[detect]
binary = "${DARKCORE_ROUTER_DIR}/.venv/bin/python"
version_args = ["--version"]   # reports the interpreter; darkcore has no CLI --version probe
version_package = "darkcore"

[server]
binary = "${DARKCORE_ROUTER_DIR}/.venv/bin/python"
args_template = ["-m", "darkcore.server", "--host", "{host}", "--port", "{port}"]
openai_compatible = true
default_port = 8000
health_path = "/health"
# Startup pays config load + exemplar snapshot + embedder warm (~25 s
# measured); generous headroom for a cold page cache.
ready_timeout_s = 300.0
