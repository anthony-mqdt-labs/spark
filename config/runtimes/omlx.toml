# oMLX — production MLX server with LRU memory management. Alt MLX backend.
name = "omlx"
description = "oMLX multi-model OpenAI-compatible server (Apple Silicon)."
model_format = "mlx"
requires_os = ["Darwin"]
requires_arch = ["arm64"]
install_hint = "brew install omlx"

[detect]
binary = "omlx"
version_args = ["--version"]

[server]
binary = "omlx"
# oMLX >=0.4 `serve` discovers models from subdirs of --model-dir (no positional/
# single-model form). spark stages a private one-model dir (see runtimes/omlx.py)
# and points --model-dir at it; --memory-guard safe respects the 16 GB box.
args_template = [
    "serve",
    "--model-dir", "{model_dir}",
    "--host", "{host}",
    "--port", "{port}",
    "--memory-guard", "safe",
]
openai_compatible = true
default_port = 8083
health_path = "/v1/models"
ready_timeout_s = 240.0

[server.secret_env]
HF_TOKEN = "hf_token"
