[project]
name = "spark"
version = "0.1.0"
description = "Hardened multi-runtime LLM inference wrapper for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "spark operator" }]

# Lean, pinned, pure-Python, no native build, no postinstall hooks.
# spark is a *wrapper*: it orchestrates already-installed runtime CLIs via
# subprocess and never imports mlx/vllm/llama itself.
dependencies = [
    "click>=8.1,<9",
    "pydantic>=2.6,<3",
    "platformdirs>=4.2,<5",
    "rich>=13.7,<14",
]

[project.scripts]
spark = "spark.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8.1,<9",
    "pytest-cov>=5.0,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spark"]

# Ship the TOML config tree inside the package so an installed `spark` can find
# its defaults regardless of CWD.
[tool.hatch.build.targets.wheel.force-include]
"config" = "spark/_bundled_config"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
